    .banner-close {

    @media (max-width: 600px) {

<body>

  <!-- Iframe em tela cheia -->
  <iframe
    class="site-frame"
    name="feiticeira-plataforma"
    src="https://app.feiticeira.club/pr/2iCVbLKr"
    title="Plataforma Feiticeira VIP - Feiticeira Club"
    allow="clipboard-read; clipboard-write; fullscreen; autoplay; payment"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
  </main>

  <!-- Banner de entrada -->
  <div class="banner-overlay" id="bannerOverlay">
    <div class="banner">
      <img class="banner-image" src="aguianovo.png" alt="Banner promocional">
      <a class="banner-link" href="https://bancaaguiaoficial.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Acessar link"></a>
      <button type="button" class="banner-close" id="bannerClose" aria-label="Fechar banner">×</button>
    </div>
  </div>

  <!-- Botão flutuante Puxada (lado esquerdo) -->
  <button type="button" class="fab" id="btnPuxada" aria-label="Abrir ferramenta" title="Puxada">PUX</button>

  <!-- Painel Puxada -->
  <div class="puxada-box" id="puxadaBox">
    <div class="puxada-header">
      PUXADA
      <button type="button" class="puxada-close" id="fecharPuxada" aria-label="Fechar">×</button>
    </div>
    <div class="puxada-content">
      <div class="puxada-search">
        <input type="text" id="animalInput" placeholder="Digite o nome de um animal..." autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>
      <div class="puxada-resultados" id="resultados">
        <div class="sem-resultado">Digite um animal para consultar suas opções.</div>
      </div>
    </div>
  </div>

  <script>
    /* Banner */
    document.getElementById("bannerClose").addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById("bannerOverlay").style.display = "none";
    });

    /* Puxada */
    const puxadaBox = document.getElementById("puxadaBox");
    const btnPuxada = document.getElementById("btnPuxada");

    btnPuxada.addEventListener("click", function() {
      puxadaBox.classList.toggle("aberto");
    });

    document.getElementById("fecharPuxada").addEventListener("click", function(e) {
      e.stopPropagation();
      puxadaBox.classList.remove("aberto");
    });

    /* Dados da ferramenta */
    const animais = {
      "avestuz": ["Vaca", "Águia", "Galo", "Pavão", "Peru"],
      "águia": ["Coelho", "Avestruz", "Galo", "Pavão", "Peru"],
      "burro": ["Cavalo", "Elefante", "Touro", "Veado", "Coelho", "Cobra"],
      "borboleta": ["Cabra", "Elefante", "Gato", "Leão", "Cachorro", "Galo"],
      "cachorro": ["Galo", "Gato", "Camelo", "Macaco", "Porco", "Pavão"],
      "cabra": ["Carneiro", "Macaco", "Elefante", "Touro", "Tigre", "Urso"],
      "carneiro": ["Cabra", "Coelho", "Vaca"],
      "camelo": ["Cachorro", "Elefante", "Urso"],
      "cobra": ["Jacaré", "Porco", "Burro", "Gato"],
      "coelho": ["Carneiro", "Águia", "Burro"],
      "cavalo": ["Burro", "Cabra", "Touro"],
      "elefante": ["Cabra", "Urso", "Tigre", "Leão", "Burro"],
      "galo": ["Cachorro", "Avestruz", "Águia", "Pavão", "Peru"],
      "gato": ["Cachorro", "Leão", "Tigre", "Cobra"],
      "jacaré": ["Cobra", "Porco", "Borboleta", "Macaco"],
      "leão": ["Elefante", "Gato", "Tigre", "Urso"],
      "macaco": ["Cachorro", "Cabra", "Peru", "Jacaré"],
      "porco": ["Cobra", "Peru", "Jacaré", "Cachorro"],
      "pavão": ["Avestruz", "Águia", "Galo", "Peru"],
      "peru": ["Avestruz", "Águia", "Galo", "Pavão", "Veado"],
      "touro": ["Vaca", "Burro", "Cabra"],
      "tigre": ["Gato", "Leão", "Cabra"],
      "urso": ["Leão", "Elefante", "Camelo", "Cabra"],
      "veado": ["Peru", "Burro", "Cabra"],
      "vaca": ["Touro", "Avestruz", "Carneiro"]
    };

    function normalizarTexto(texto) {
      return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    const animalInput = document.getElementById("animalInput");
    const resultados = document.getElementById("resultados");

    animalInput.addEventListener("input", function() {
      const busca = normalizarTexto(this.value);
      resultados.innerHTML = "";
      if (!busca) {
        resultados.innerHTML = '<div class="sem-resultado">Digite um animal para consultar suas opções.</div>';
        return;
      }
      const animalEncontrado = Object.keys(animais).find(animal => normalizarTexto(animal) === busca);
      if (!animalEncontrado) {
        const sugestoes = Object.keys(animais).filter(animal => normalizarTexto(animal).includes(busca));
        if (sugestoes.length > 0) {
          resultados.innerHTML = '<div class="resultado-titulo">Você quis dizer:</div>';
          sugestoes.forEach(animal => {
            const item = document.createElement("span");
            item.className = "animal-result";
            item.textContent = animal.charAt(0).toUpperCase() + animal.slice(1);
            item.onclick = function() {
              animalInput.value = animal;
              mostrarResultados(animal);
            };
            resultados.appendChild(item);
          });
          return;
        }
        resultados.innerHTML = '<div class="sem-resultado">Animal não encontrado.</div>';
        return;
      }
      mostrarResultados(animalEncontrado);
    });

    function mostrarResultados(animal) {
      resultados.innerHTML = '<div class="resultado-titulo">Opções para ' + (animal.charAt(0).toUpperCase() + animal.slice(1)) + ':</div>';
      animais[animal].forEach(opcao => {
        const item = document.createElement("span");
        item.className = "animal-result";
        item.textContent = opcao;
        resultados.appendChild(item);
      });
    }
  </script>
</body>
